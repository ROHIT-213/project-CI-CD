name: "CD to deploy artifact created on ci.yml file and place is same server /opt"
on:
  workflow_run:
    workflows: ["Running the CI for profile update"]
    types:
      - completed
jobs:
  deploy:
    name: Deploying the nodejs application to ec2 instance as runner in aws ap-south-1
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Install pm2
        run: sudo npm install -g pm2

      - name: Stop existing app
        run: pm2 stop profile-app || true

      - name: Start app
        run: pm2 start /home/ubuntu/actions-runner/_work/project-CI-CD/project-CI-CD/dist/src/index.js --name profile-app

      - name: Save pm2 process list
        run: pm2 save

      - name: Deployment completed
        run: echo "Deployment completed successfully"